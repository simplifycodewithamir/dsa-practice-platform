# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore
        run: dotnet restore source/DsaPractice.slnx

      - name: Build
        run: dotnet build source/DsaPractice.slnx --configuration Release --no-restore

      - name: Unit tests
        run: |
          dotnet test --project tests/DsaPractice.Api.UnitTests/DsaPractice.Api.UnitTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.ContentSeeding.UnitTests/DsaPractice.ContentSeeding.UnitTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.Judge.UnitTests/DsaPractice.Judge.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Frontend build and tests
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        working-directory: frontend

      - name: Integration tests
        run: |
          dotnet test --project tests/DsaPractice.Api.IntegrationTests/DsaPractice.Api.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.ContentSeeding.IntegrationTests/DsaPractice.ContentSeeding.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.Judge.IntegrationTests/DsaPractice.Judge.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
