# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: work is sometimes stacked one branch on
  # the next, and those pull requests need checking too.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore
        run: dotnet restore source/DsaPractice.slnx

      - name: Build
        run: dotnet build source/DsaPractice.slnx --configuration Release --no-restore

      - name: Unit tests
        run: |
          dotnet test --project tests/DsaPractice.Api.UnitTests/DsaPractice.Api.UnitTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.ContentSeeding.UnitTests/DsaPractice.ContentSeeding.UnitTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.Contracts.UnitTests/DsaPractice.Contracts.UnitTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.Judge.UnitTests/DsaPractice.Judge.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Frontend build and tests
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        working-directory: frontend

      - name: Integration tests
        run: |
          dotnet test --project tests/DsaPractice.Api.IntegrationTests/DsaPractice.Api.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.ContentSeeding.IntegrationTests/DsaPractice.ContentSeeding.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.Judge.IntegrationTests/DsaPractice.Judge.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  # The whole product against itself: real Api, real broker, and a Judge that runs submitted code
  # in a container. Its own job, because it builds images and is slower than the unit suites.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Submissions need a signed-in caller since item 20, and there is no identity provider in
      # front of the end-to-end stack: the Api trusts a development signing key generated here,
      # and the frontend build bakes in a token signed with it. Both come from one command, so
      # they cannot drift apart. Nothing minted here is trusted by a real deployment -- the Api
      # refuses to start with a symmetric key in Production.
      - name: Write .env for docker compose, and a development token
        run: |
          node tools/mint-dev-token.mjs > "$RUNNER_TEMP/dev-auth.env"
          {
            echo "POSTGRES_DB=dsapractice"
            echo "POSTGRES_USER=dsapractice"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "RABBITMQ_USER=dsapractice"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 16)"
            grep '^DEV_JWT_' "$RUNNER_TEMP/dev-auth.env"
          } > .env
          # Vite reads .env.local on its own, so the build needs nothing passed to it.
          grep '^VITE_DEV_ACCESS_TOKEN=' "$RUNNER_TEMP/dev-auth.env" > frontend/.env.local

      - name: Start the stack
        run: docker compose --profile full-stack up -d --build

      - name: Wait for the Api
        run: |
          for _ in $(seq 1 90); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 2
          done
          echo "Api never became healthy"; docker compose logs --tail=50; exit 1

      - name: Build the frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Service logs on failure
        if: failure()
        run: docker compose --profile full-stack logs --tail=200

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose --profile full-stack down -v

