# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore source/DsaPractice.slnx

      - name: Build
        run: dotnet build source/DsaPractice.slnx --configuration Release --no-restore

      - name: Unit tests
        run: |
          dotnet test --project tests/DsaPractice.Api.UnitTests/DsaPractice.Api.UnitTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.ContentSeeding.UnitTests/DsaPractice.ContentSeeding.UnitTests.csproj --configuration Release --no-build --verbosity normal
          # DsaPractice.Judge has no implementation yet, so its unit test project is deliberately
          # empty -- MTP treats "zero tests ran" as a failure (exit 8), so allow it until real
          # Judge tests exist. Remove --ignore-exit-code once this project has its first [Fact].
          dotnet test --project tests/DsaPractice.Judge.UnitTests/DsaPractice.Judge.UnitTests.csproj --configuration Release --no-build --verbosity normal -- --ignore-exit-code 8

      - name: Integration tests
        run: |
          dotnet test --project tests/DsaPractice.Api.IntegrationTests/DsaPractice.Api.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test --project tests/DsaPractice.ContentSeeding.IntegrationTests/DsaPractice.ContentSeeding.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
