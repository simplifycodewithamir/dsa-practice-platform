services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  api:
    build:
      context: .
      dockerfile: source/DsaPractice.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DsaPractice: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      - postgres
      - rabbitmq

  judge:
    build:
      context: .
      dockerfile: source/DsaPractice.Judge/Dockerfile
    depends_on:
      - rabbitmq
    volumes:
      # required so the Judge service can spin up sandbox containers on the host
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  rabbitmqdata: