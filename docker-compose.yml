# Local development only. Production deployment is deliberately out of scope for now
# (solo MVP stage — see the dsa-practice-platform skill's CI/CD deviation note); revisit
# under the cicd-pipeline skill's pattern (K8s manifests, managed Postgres/RabbitMQ) when
# this needs a real prod-grade rollout. Nothing here is a template for that.
#
# Default (no --profile flag) brings up just the infra -- Postgres + RabbitMQ -- so you can
# run Api/Judge yourself via `dotnet run` or a debugger (see README "Run and debug in VS Code").
# `docker compose --profile full-stack up -d --build` also builds and runs the app containers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12

  # One-shot: applies pending EF Core migrations, upserts the questions under content/, then
  # exits. Both halves are idempotent, so re-run it whenever the schema or the content changes:
  # `docker compose run --rm migrator`. Also gates `api` in the full-stack profile.
  migrator:
    build:
      context: .
      dockerfile: source/DataMigrations/DsaPractice.DataMigrations.Postgres/Dockerfile
    environment:
      ConnectionStrings__DsaPractice: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Content__Path: /app/content
    volumes:
      # Local dev: edit a statement or a test case and re-run the migrator, no image rebuild.
      # The image carries its own copy of content/ for deployments (see the Dockerfile).
      - ./content:/app/content:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: source/DsaPractice.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DsaPractice: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMq__Uri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      # Submissions need a signed-in caller. There is no identity provider in front of a local
      # stack, so this one trusts a symmetric development key from .env instead of an Authority --
      # mint a matching token with `node tools/mint-dev-token.mjs`, and see docs/auth.md. The Api
      # refuses to start with a symmetric key when ASPNETCORE_ENVIRONMENT is Production.
      Auth__RequireAuthentication: "${AUTH_REQUIRE_AUTHENTICATION:-true}"
      Authentication__Schemes__Bearer__ValidIssuer: "${DEV_JWT_ISSUER}"
      Authentication__Schemes__Bearer__ValidAudiences__0: "${DEV_JWT_AUDIENCE}"
      Authentication__Schemes__Bearer__SigningKeys__0__Id: dev
      Authentication__Schemes__Bearer__SigningKeys__0__Issuer: "${DEV_JWT_ISSUER}"
      Authentication__Schemes__Bearer__SigningKeys__0__Value: "${DEV_JWT_SIGNING_KEY}"
      Authentication__Schemes__Bearer__SigningKeys__0__Length: "32"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # The Judge needs the Docker API to create sandboxes, but the raw socket is root-equivalent on
  # the host: anything holding it can start a privileged container and own the machine. This proxy
  # exposes only the endpoints the Judge actually uses, so a compromised Judge cannot, for example,
  # bind-mount the host filesystem into a new container.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: ["full-stack"]
    environment:
      CONTAINERS: 1   # create, start, attach, wait, inspect, remove sandboxes
      IMAGES: 1       # pull and list runner images
      VOLUMES: 1      # per-submission artifact volumes for compiled languages
      POST: 1         # without this the proxy is read-only and nothing can be created
      EXEC: 0         # no exec into existing containers
      NETWORKS: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      TASKS: 0
      PLUGINS: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  judge:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: source/DsaPractice.Judge/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      RabbitMq__Uri: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      # Talks to the proxy, never to the socket itself.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      rabbitmq:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

volumes:
  pgdata:
  rabbitmqdata:
